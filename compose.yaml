services:
  prepare:
    image: jigas-graph-money:local
    entrypoint: ["python", "scripts/prepare_data.py"]
    command: []
    volumes:
      - ./track_data:/app/track_data:ro
      - ./data:/app/data

  pipeline:
    build: .
    image: jigas-graph-money:local
    volumes:
      - ./data:/app/data:ro
      - ./out:/app/out
    command: ["--data", "/app/data", "--out", "/app/out"]
